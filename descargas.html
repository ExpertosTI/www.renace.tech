<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descargas — RENACE.TECH</title>
  <meta name="description" content="Descargas de RENACE.TECH: Portal, POS Agent y herramientas." />
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1a;
      --surface: #111827;
      --border: rgba(148, 163, 184, 0.12);
      --border-focus: rgba(0, 180, 216, 0.6);
      --text: #e8edf5;
      --muted: #7b8faa;
      --accent: #00b4d8;
      --accent-2: #0077b6;
      --accent-glow: rgba(0, 180, 216, 0.15);
      --purple: #8b5cf6;
      --teal: #2dd4bf;
    }

    html { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(45, 212, 191, 0.08), transparent 50%),
        radial-gradient(ellipse at 85% 85%, rgba(139, 92, 246, 0.06), transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(45, 212, 191, 0.03), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .portal-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(10, 15, 26, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo svg { height: 26px; }
    .nav-logo .wordmark { height: 18px; opacity: 0.9; }
    .nav-link {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--text); }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 110px 24px 72px;
    }

    .hero {
      text-align: center;
      max-width: 560px;
      margin-bottom: 48px;
      animation: rise 0.7s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(45, 212, 191, 0.08);
      border: 1px solid rgba(45, 212, 191, 0.2);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 28px;
    }
    .badge svg { width: 14px; height: 14px; }

    .hero-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, rgba(17, 24, 39, 0.95), rgba(15, 20, 32, 0.9));
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: rise 0.8s ease 0.08s both;
    }
    .hero-mark svg { width: 38px; height: 38px; }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.2rem, 5.5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
      margin-bottom: 14px;
    }
    h1 .hl {
      background: linear-gradient(90deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .btn-hero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: #0a0f1a;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(0, 180, 216, 0.28);
      transition: filter 0.2s, transform 0.15s;
      animation: rise 0.85s ease 0.12s both;
    }
    .btn-hero:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-hero[hidden], .btn-hero.is-empty { display: none; }
    .btn-hero svg { width: 18px; height: 18px; }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      min-height: 1.2em;
    }

    .list-wrap {
      width: 100%;
      max-width: 560px;
      animation: rise 0.9s ease 0.16s both;
    }

    .list-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 4px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    .row:hover { background: rgba(0, 180, 216, 0.04); }
    .row.preferred .name { color: var(--accent); }

    .row-ico {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent-glow);
      color: var(--accent);
    }
    .row-ico svg { width: 18px; height: 18px; }

    .row-body { flex: 1; min-width: 0; }
    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 2px;
    }
    .meta { color: var(--muted); font-size: 12.5px; }

    .row-go {
      color: var(--muted);
      flex-shrink: 0;
    }
    .row-go svg { width: 18px; height: 18px; }

    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
    }

    .foot {
      margin-top: 40px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .foot a { color: var(--accent); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .portal-nav { padding: 14px 18px; }
      main { padding: 96px 18px 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var SKIP = /icon\.png|rufus|vc_redist/i;
      var ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      var GO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

      var ua = navigator.userAgent || '';
      var platform = navigator.platform || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var isWin = /Windows/i.test(ua);
      var isMac = (/Mac/i.test(platform) || /Macintosh/i.test(ua)) && !isIOS;

      function score(doc) {
        var n = (doc.name || '') + ' ' + (doc.file || '');
        var s = 0;
        if (isWin && /windows|win64|pos.?agent|\.exe/i.test(n)) s += 3;
        if (isAndroid && /android|\.apk|env[ií]os/i.test(n)) s += 3;
        if (isIOS && /ios|iphone|ipad/i.test(n)) s += 3;
        if (isMac && /mac|dmg|apple.?silicon|arm64/i.test(n)) s += 3;
        if (/portal/i.test(n)) s += 1;
        if (/pos.?agent/i.test(n)) s += 1;
        return s;
      }

      function keep(doc) {
        if (!doc || !doc.file || !doc.available) return false;
        var blob = (doc.name || '') + ' ' + (doc.file || '') + ' ' + (doc.type || '') + ' ' + (doc.category || '');
        if (SKIP.test(blob)) return false;
        if (/^image$/i.test(doc.category || '') || /^png|jpe?g|gif|webp|svg$/i.test(doc.type || '')) return false;
        return true;
      }

      function render(docs) {
        var rows = document.getElementById('rows');
        var empty = document.getElementById('empty');
        var primary = document.getElementById('primary');
        var hint = document.getElementById('hint');
        rows.innerHTML = '';

        var list = docs.filter(keep).sort(function (a, b) {
          return score(b) - score(a) || String(a.name).localeCompare(String(b.name));
        });

        if (!list.length) {
          empty.hidden = false;
          primary.classList.add('is-empty');
          hint.textContent = '';
          return;
        }
        empty.hidden = true;

        var best = list[0];
        list.forEach(function (doc, i) {
          var a = document.createElement('a');
          a.className = 'row' + (i === 0 ? ' preferred' : '');
          a.href = doc.file;
          a.innerHTML =
            '<span class="row-ico">' + ICO + '</span>' +
            '<span class="row-body">' +
              '<div class="name"></div>' +
              '<div class="meta"></div>' +
            '</span>' +
            '<span class="row-go">' + GO + '</span>';
          a.querySelector('.name').textContent = doc.name;
          var bits = [doc.type, doc.size].filter(Boolean);
          a.querySelector('.meta').textContent = bits.join(' · ');
          rows.appendChild(a);
        });

        primary.classList.remove('is-empty');
        primary.href = best.file;
        document.getElementById('primary-label').textContent = 'Descargar ' + best.name;
        hint.textContent = list.length > 1 ? 'También puedes elegir otro archivo abajo.' : '';
      }

      fetch('/api/documents', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) { render(Array.isArray(data) ? data : []); })
        .catch(function () { render([]); });
    })();
  </script>
