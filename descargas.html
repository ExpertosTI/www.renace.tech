      }

      function prefersReduced() {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function animateIn() {
        if (typeof gsap === 'undefined' || prefersReduced()) return;

        gsap.set(['.portal-nav', '.intro > *', '.col', '.legal', '.glow'], { clearProps: 'all' });

        var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
        tl.from('.portal-nav', { y: -18, opacity: 0, duration: 0.55 })
          .from('.glow', { opacity: 0, scale: 0.7, duration: 0.9 }, 0.05)
          .from('.intro > *', { y: 22, opacity: 0, duration: 0.55, stagger: 0.08 }, 0.12)
          .from('.col', { y: 36, opacity: 0, duration: 0.65, stagger: 0.1 }, 0.22)
          .from('.legal', { opacity: 0, duration: 0.4 }, 0.45);

        gsap.to('.glow', {
          scale: 1.08,
          opacity: 0.85,
          duration: 3.2,
          yoyo: true,
          repeat: -1,
          ease: 'sine.inOut',
        });

        gsap.to('.os-ico', {
          y: -6,
          duration: 2.4,
          yoyo: true,
          repeat: -1,
          ease: 'sine.inOut',
          stagger: { each: 0.25, from: 'start' },
        });

        document.querySelectorAll('a.btn-dl').forEach(function (btn) {
          btn.addEventListener('mouseenter', function () {
            gsap.to(btn, { y: -3, scale: 1.03, duration: 0.22, ease: 'power2.out' });
          });
          btn.addEventListener('mouseleave', function () {
            gsap.to(btn, { y: 0, scale: 1, duration: 0.28, ease: 'power2.out' });
          });
        });

        var active = document.querySelector('.col.active');
        if (active) {
          gsap.fromTo(
            active,
            { boxShadow: '0 0 0 1px rgba(0,180,216,0.12), 0 0 0 rgba(0,180,216,0)' },
            {
              boxShadow: '0 0 0 1px rgba(0,180,216,0.35), 0 18px 50px -18px rgba(0,180,216,0.45)',
              duration: 1.4,
              yoyo: true,
              repeat: -1,
              ease: 'sine.inOut',
            }
          );
        }
      }

      function boot() {
        render();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
